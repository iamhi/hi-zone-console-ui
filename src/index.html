<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terminal UI</title>
</head>

<body>
  <div class="terminal">
    <div class="terminal-content" id="terminal-content">
      <div class="terminal-output">Welcome to Terminal UI v1.0.0</div>
      <div class="terminal-line">
        <span class="terminal-prompt">$</span>
        <input type="text" class="terminal-input" value="" autofocus>
      </div>
    </div>
  </div>
</body>

</html>
